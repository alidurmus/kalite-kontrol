<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Formu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <h1>Logo/Title</h1>
        <nav>User Menu</nav>
    </header>
    <div class="app-body">
        <aside class="sidebar-nav">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="kullanici-listesi.html">Kullanıcı Yönetimi</a></li>
                <li><a href="urun-listesi.html">Ürün Takip Sistemi</a></li>
                <li><a href="test-sonuclari.html">Test ve Kalite Kontrol</a></li>
                <li><a href="istasyon-izleme.html">Üretim Süreci İzleme</a></li>
                <li><a href="raporlama.html">Raporlama</a></li>
                <li><a href="cikti-olusturma.html">Form ve Etiketler</a></li>
                <li><a href="ayarlar.html">Ayarlar</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <h2>Yeni Kullanıcı Ekle / Kullanıcı Düzenle</h2>
            <form class="user-form">
                <div class="form-group">
                    <label for="user-id">Kullanıcı ID</label>
                    <input type="text" id="user-id" name="user-id" readonly>
                </div>
                <div class="form-group">
                    <label for="full-name">Ad Soyad</label>
                    <input type="text" id="full-name" name="full-name" required>
                </div>
                <div class="form-group">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="password-confirm">Şifre Tekrar</label>
                    <input type="password" id="password-confirm" name="password-confirm" required>
                </div>
                <div class="form-group">
                    <label for="role">Rol</label>
                    <select id="role" name="role" required>
                        <option value="admin">Admin</option>
                        <option value="operator">Operatör</option>
                        <option value="manager">Yönetici</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Durum</label>
                    <select id="status" name="status" required>
                        <option value="active">Aktif</option>
                        <option value="inactive">Pasif</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">[S] Kaydet</button>
                    <a href="kullanici-listesi.html" class="btn btn-secondary">[C] İptal</a>
                </div>
            </form>
        </main>
    </div>
    <footer class="app-footer">
        <p>&copy; 2024 Application</p>
    </footer>
</body>
</html>
