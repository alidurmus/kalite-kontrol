version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: codeigniter_web
    environment:
      - CI_ENV=docker
    volumes:
      - ./apache-config/000-default.conf:/etc/apache2/sites-available/000-default.conf
      - .:/var/www/html
    ports:
      - "8090:80"
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: cms_panel
    volumes:
      - db_data:/var/lib/mysql
      - ./uploads/sql:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - app-network

  playwright:
    build:
      context: .
      dockerfile: playwright.Dockerfile
    container_name: playwright_tests
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "test"]
    depends_on:
      - web

networks:
  app-network:
    driver: bridge

volumes:
  db_data: 